[package]
name = "gridepos-cotizaciones"
version = "1.0.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
